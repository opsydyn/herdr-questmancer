[package]
name = "questmancer"
version = "0.1.9"
edition = "2024"
rust-version = "1.90"
description = "A cozy fantasy guild and dungeon control room for coding agents."
license = "MIT"
repository = "https://github.com/opsydyn/herdr-questmancer"
readme = "README.md"
keywords = ["herdr", "ratatui", "agents", "tui", "fantasy"]
categories = ["command-line-utilities", "development-tools"]
# The crate ships the plugin and the art it renders, and nothing else. Source
# illustrations, screenshots and the launch site are repository material: they
# are worth keeping in git and worth nothing to `cargo install`. Left in, they
# took the package to 32 MiB against a 10 MiB registry limit.
exclude = [
  "/reference-art",
  "/site",
  "/docs/superpowers",
  "/docs/design/reviews",
  "/docs/reviews",
  "/*.png",
  "/.github",
]

[features]
default = []
storybook = []

[[bin]]
name = "questmancer-storybook"
path = "src/bin/questmancer_storybook.rs"
required-features = ["storybook"]

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
getrandom = "0.4"
ratatui = "0.30"
rustix = { version = "1.1", features = ["termios"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["std"] }
toml = "1.1"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "test-util",
  "time"
] }
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
image = { version = "0.25.6", default-features = false, features = ["png"] }

[dev-dependencies]
rustix = { version = "1.1", features = ["pty"] }
proptest = "1.11"
signal-hook = "0.3"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Debug builds were the largest thing on this machine by a wide margin: 36 GB
# allocated in `target/`, of which 24 GB was `debug/deps`. Full debug info is
# the reason — every dependency carries a complete description of its types and
# locals, and this crate builds a lot of test binaries.
#
# `line-tables-only` keeps what is actually read here: file and line in panics
# and test failures, which is how every golden-hash and guard failure in this
# project gets diagnosed. What it drops is the ability to inspect variables in
# a debugger, which nothing in this workflow does.
[profile.dev]
debug = "line-tables-only"

# Test and bench binaries inherit dev, but say so explicitly: they are the bulk
# of the artifacts here, and inheriting silently is how this went unnoticed.
[profile.test]
debug = "line-tables-only"

[profile.release]
strip = true
lto = "thin"
