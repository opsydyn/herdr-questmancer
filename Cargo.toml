[package]
name = "questmancer"
version = "0.1.3"
edition = "2024"
rust-version = "1.90"
description = "A cozy fantasy guild and dungeon control room for coding agents."
license = "MIT"
repository = "https://github.com/opsydyn/herdr-questmancer"
readme = "README.md"
keywords = ["herdr", "ratatui", "agents", "tui", "fantasy"]
categories = ["command-line-utilities", "development-tools"]
# The crate ships the plugin and the art it renders, and nothing else. Source
# illustrations, screenshots and the launch site are repository material: they
# are worth keeping in git and worth nothing to `cargo install`. Left in, they
# took the package to 32 MiB against a 10 MiB registry limit.
exclude = [
  "/reference-art",
  "/site",
  "/docs/superpowers",
  "/*.png",
  "/.github",
]

[features]
default = []
storybook = []

[[bin]]
name = "questmancer-storybook"
path = "src/bin/questmancer_storybook.rs"
required-features = ["storybook"]

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.1"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "test-util",
  "time"
] }
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
image = { version = "0.25.6", default-features = false, features = ["png"] }

[dev-dependencies]
proptest = "1.11"
signal-hook = "0.3"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
strip = true
lto = "thin"
