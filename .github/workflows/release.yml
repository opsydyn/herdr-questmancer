name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run complete release gate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
          bash tests/scripts.sh
          bash -n herdr/install.sh herdr/run.sh herdr/control.sh
          cargo build --release
          base_sha=$(git rev-parse HEAD^)
          git diff --check "${base_sha}"...HEAD

      # `cargo package` builds the crate from the packaged tarball, so it is
      # the only check that catches excluding a file the build needs. The size
      # bound is not cosmetic: crates.io refuses uploads over 10 MiB, and this
      # crate reached 32 MiB by carrying source illustrations and screenshots
      # that `cargo install` has no use for.
      - name: Verify the published crate surface
        shell: bash
        run: |
          set -euo pipefail
          cargo package --locked
          crate="target/package/questmancer-${GITHUB_REF_NAME#v}.crate"
          [[ -f $crate ]] || {
            echo "cargo package produced no crate at $crate" >&2
            exit 1
          }
          bytes=$(wc -c <"$crate")
          limit=$((10 * 1024 * 1024))
          printf 'packaged crate: %s bytes\n' "$bytes"
          (( bytes < limit )) || {
            echo "crate is ${bytes} bytes, over the ${limit} byte crates.io limit" >&2
            echo 'add the offending paths to exclude in Cargo.toml' >&2
            exit 1
          }

      - name: Verify the tag matches every version
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          for file in Cargo.toml herdr-plugin.toml; do
            declared=$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$file" | head -n 1)
            [[ $version == "$declared" ]] || {
              echo "tag $version does not match $file version $declared" >&2
              exit 1
            }
          done

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            builder: cargo
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            builder: cross
          - target: x86_64-apple-darwin
            os: macos-latest
            builder: cargo
          - target: aarch64-apple-darwin
            os: macos-latest
            builder: cargo
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross
        if: matrix.builder == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross@0.2.5

      - name: Build release binary
        shell: bash
        run: ${{ matrix.builder }} build --locked --release --target "${{ matrix.target }}"

      - name: Package archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          manifest_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' herdr-plugin.toml | head -n 1)
          [[ $version == "$manifest_version" ]] || {
            echo "tag version $version does not match manifest version $manifest_version" >&2
            exit 1
          }
          target=$TARGET
          archive="questmancer-v${version}-${target}.tar.gz"
          staging=$(mktemp -d)
          install -m 0755 "target/$target/release/questmancer" "$staging/questmancer"
          tar -C "$staging" -czf "$archive" questmancer
          [[ $(tar -tzf "$archive") == questmancer ]] || {
            echo "$archive must contain only a root-level questmancer executable" >&2
            exit 1
          }

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: questmancer-v*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download matrix archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true

      - name: Validate matrix and create checksums
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          expected=(
            "questmancer-v${version}-x86_64-unknown-linux-gnu.tar.gz"
            "questmancer-v${version}-aarch64-unknown-linux-gnu.tar.gz"
            "questmancer-v${version}-x86_64-apple-darwin.tar.gz"
            "questmancer-v${version}-aarch64-apple-darwin.tar.gz"
          )
          for archive in "${expected[@]}"; do
            [[ -f $archive ]] || {
              echo "missing release archive: $archive" >&2
              exit 1
            }
          done
          [[ $(find . -maxdepth 1 -name 'questmancer-v*.tar.gz' -print | wc -l) -eq 4 ]] || {
            echo "release must contain exactly four Questmancer archives" >&2
            exit 1
          }
          sha256sum "${expected[@]}" >SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            questmancer-v*.tar.gz
            SHA256SUMS

  crates-io:
    name: Publish to crates.io
    # Last, and only once the binaries are out. A crates.io publish is
    # irreversible — a version can be yanked but never replaced — so nothing
    # reaches the registry until the artefacts people actually install exist.
    #
    # Off until the registry work is finished. The job is written and tested,
    # but a release today would reach this step with no token and go red after
    # the GitHub release had already succeeded — a red release that shipped
    # correctly is worse than one that never ran. Set the repository variable
    # PUBLISH_TO_CRATES to `true` to turn it on.
    if: ${{ vars.PUBLISH_TO_CRATES == 'true' }}
    needs: publish
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0

      - uses: Swatinem/rust-cache@v2

      - name: Publish
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n ${CARGO_REGISTRY_TOKEN:-} ]] || {
            echo "CARGO_REGISTRY_TOKEN is unset; add it to the crates-io environment" >&2
            exit 1
          }
          version=${GITHUB_REF_NAME#v}
          # Publishing the same version twice is an error rather than a no-op,
          # so a re-run of this workflow would fail here. Say why plainly
          # instead of leaving a red job with a registry error in it.
          if cargo search questmancer --limit 1 | grep -q "^questmancer = \"${version}\""; then
            echo "questmancer ${version} is already on crates.io; nothing to publish"
            exit 0
          fi
          cargo publish --locked
