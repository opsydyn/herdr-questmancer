name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt - clippy - test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Test lifecycle scripts
        run: bash tests/scripts.sh

      - name: Check shell syntax
        run: bash -n herdr/install.sh herdr/run.sh herdr/control.sh

      - name: Build release binary
        run: cargo build --release

      - name: Check diff hygiene
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base_sha=$BASE_SHA
          if [[ -z $base_sha || $base_sha =~ ^0+$ ]] || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            if base_sha=$(git rev-parse HEAD^ 2>/dev/null); then
              :
            else
              git show --check --format= HEAD
              exit 0
            fi
          fi
          base_sha=$(git merge-base "$base_sha" HEAD)
          git diff --check "${base_sha}"...HEAD
