name: Release plz

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-pr:
    name: Open the release pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0

      - uses: Swatinem/rust-cache@v2

      - name: Open or update the release pull request
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # release-plz bumps Cargo.toml and knows nothing about the Herdr
      # manifest, which `herdr/install.sh` uses to build the release archive
      # name. Drift there is not cosmetic: `herdr plugin install` downloads an
      # archive no release published and fails with a 404 for every user.
      #
      # This was a documented manual step. It was missed twice — once fixed by
      # hand, then broken again by the next bump — which is what a manual step
      # in an automated pipeline does. Now the pipeline does it.
      - name: Sync the Herdr manifest on the release branch
        if: ${{ steps.release-plz.outputs.prs != '' && steps.release-plz.outputs.prs != '[]' }}
        shell: bash
        env:
          PRS: ${{ steps.release-plz.outputs.prs }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch=$(jq -r '.[0].head_branch // empty' <<<"$PRS")
          if [[ -z $branch ]]; then
            echo "release-plz reported a pull request with no branch; nothing to sync" \
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git fetch --depth=1 origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          bash scripts/sync-plugin-version.sh
          if git diff --quiet -- herdr-plugin.toml; then
            echo "manifest already matches Cargo.toml" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add herdr-plugin.toml
          git commit -m "fix: sync the Herdr manifest to the released version"
          git push origin "$branch"
          echo "synced herdr-plugin.toml on $branch" >>"$GITHUB_STEP_SUMMARY"

      - name: Record what happened
        if: always()
        shell: bash
        env:
          PRS_CREATED: ${{ steps.release-plz.outputs.prs_created }}
          PRS: ${{ steps.release-plz.outputs.prs }}
        run: |
          set -euo pipefail
          # A release job that decides to do nothing has to say so. Silence
          # here reads exactly like success, and a release that never opened
          # is only noticed when somebody goes looking for it.
          if [[ ${PRS_CREATED:-false} == "true" ]]; then
            echo "opened or updated a release pull request: ${PRS:-unknown}" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "no releasable change; no release pull request opened" >>"$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: Tag the merged release
    # The half that was missing. `release-pr` opens the version pull request;
    # nothing tags it. Merging the first one bumped the version and stopped
    # there, so `release.yml` — which triggers on the tag — never ran and no
    # binaries were ever built.
    #
    # Publishing is off in release-plz.toml, so this creates the tag and
    # nothing else. The tag is what hands over to release.yml.
    needs: release-pr
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The same token the tag is created with, so the push carries an
          # identity GitHub will start workflows for.
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0

      - uses: Swatinem/rust-cache@v2

      - name: Tag any release commit on main
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          # GitHub refuses to start workflows from events created with
          # GITHUB_TOKEN, so a tag pushed with it never reaches release.yml —
          # the tag exists and no binaries are ever built. A personal access
          # token with `contents: write` is the only thing that fixes it.
          #
          # The fallback keeps this job working without the secret: it still
          # tags, the release simply needs dispatching by hand. See
          # docs/release-process.md.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Record what happened
        if: always()
        shell: bash
        env:
          RELEASES_CREATED: ${{ steps.release-plz.outputs.releases_created }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          if [[ ${RELEASES_CREATED:-false} == "true" ]]; then
            echo "tagged: ${RELEASES:-unknown}" >>"$GITHUB_STEP_SUMMARY"
            if [[ -z "${{ secrets.RELEASE_PLZ_TOKEN }}" ]]; then
              {
                echo
                echo '> **The tag will not build on its own.** It was created with'
                echo '> `GITHUB_TOKEN`, and GitHub does not start workflows from'
                echo '> events that token creates. Dispatch it:'
                echo '>'
                echo '> ```'
                echo "> gh workflow run release.yml -f tag=<the tag above>"
                echo '> ```'
                echo '>'
                echo '> Add a `RELEASE_PLZ_TOKEN` secret to stop this recurring.'
              } >>"$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "no release commit on main; nothing tagged" >>"$GITHUB_STEP_SUMMARY"
          fi
