  <script>
  (() => {
    const root=document.getElementById('qm-sidebar-review');
    const configs=JSON.parse(root.querySelector('#qm-config-data').textContent);
    const state={layout:'four',width:'24',examples:'active',ascii:false};
    const fixtures=[
      {agent:'Codex',machine:'Local',role:'Elf Wizard',sigil:'✧',abbr:'Wz',epithet:'the Patient',trinket:'Brass Key',count:0},
      {agent:'Claude',machine:'Local',role:'Human Ranger',sigil:'↟',abbr:'Rg',epithet:'the Keen',trinket:'Pressed Leaf',count:2},
      {agent:'Codex',machine:'Local',role:'Dwarf Barbarian',sigil:'⚔',abbr:'Ba',epithet:'the Resolute',trinket:'Lucky Coin',count:0}
    ];
    const sets={active:[['Restrained','seeks counsel','●●●○○○'],['Concentrating','on expedition',''],['Resting','at the hearth','']],other:[['Restrained','seeks counsel','●○○○○○'],['Triumphant','returned with spoils',''],['Blinded','whereabouts unknown','']]};
    function values(f,i){
      const [condition,omen,vigil]=sets[state.examples][i];
      const glyph=state.ascii?'*':'◈';
      return {agent:f.agent,machine:f.machine,state_icon:'●',
        '$quest_sigil':state.ascii?f.abbr:f.sigil,'$quest_role':f.role,'$quest_epithet':f.epithet,
        '$quest_condition':condition,'$quest_omen':omen,'$quest_trinket':(state.ascii?'~':'❖')+' '+f.trinket,
        '$quest_vigil':state.ascii?vigil.replaceAll('●','#').replaceAll('○','-'):vigil,
        '$quest_hoard':glyph+' '+(f.count===0?'empty':f.count+' spoils')};
    }
    function style(element,value){
      const base=typeof element==='string'?{fg:'#9399b2'}:{...element};
      for(const rule of base.rules||[]){
        if(('equals'in rule&&value===rule.equals)||('starts_with'in rule&&value.startsWith(rule.starts_with))){Object.assign(base,rule);break;}
      }
      return base;
    }
    function paint(container,key){
      container.replaceChildren();let total=0;
      fixtures.forEach((f,i)=>{
        const data=values(f,i),box=document.createElement('div');box.className='qm-agent';
        for(const row of configs[key].rows){
          const parts=row.map(e=>({e,key:typeof e==='string'?e:e.token})).filter(p=>data[p.key]);
          if(!parts.length)continue;
          const chars=[];
          parts.forEach((p,index)=>{
            if(index){const sep=parts[index-1].key==='state_icon'?' ':' · ';for(const c of sep)chars.push({c,fg:'#9399b2'});}
            const s=style(p.e,data[p.key]);
            if(p.key==='state_icon')s.fg={'Restrained':'#f38ba8','Concentrating':'#e5b95c','Resting':'#9399b2','Triumphant':'#a6e3a1','Blinded':'#cba6f7'}[data['$quest_condition']];
            for(const c of data[p.key])chars.push({c,fg:s.fg||'#9399b2',bold:s.bold});
          });
          const line=document.createElement('div');line.className='qm-line';
          line.setAttribute('aria-label',chars.map(x=>x.c).join(''));
          const width=Number(state.width);const clipped=chars.length>width;
          const shown=chars.slice(0,clipped?width-1:width);if(clipped)shown.push({c:'…',fg:'#9399b2'});
          for(const char of shown){const span=document.createElement('span');span.textContent=char.c;span.style.color=char.fg;span.style.fontWeight=char.bold?'700':'400';line.append(span);}
          box.append(line);total++;
        }
        container.append(box);
      });
      return total+fixtures.length-1;
    }
    function render(){
      root.querySelector('#qm-layout').value=state.layout;root.querySelector('#qm-width').value=state.width;
      root.querySelector('#qm-states').value=state.examples;root.querySelector('#qm-ascii').checked=state.ascii;
      root.querySelector('#qm-proposed-title').textContent=state.layout==='four'?'Four rows · condition first':'Three rows · compact proposal';
      for(const [id,key] of [['current','current'],['proposed',state.layout]]){
        const lines=paint(root.querySelector('#qm-'+id),key);
        root.querySelector('#qm-'+id+'-count').textContent=lines+' display rows for these three adventurers';
      }
    }
    for(const [id,key] of [['layout','layout'],['width','width'],['states','examples'],['ascii','ascii']]){
      root.querySelector('#qm-'+id).addEventListener('change',e=>{state[key]=key==='ascii'?e.target.checked:e.target.value;render();});
    }
    render();
    if(globalThis.Tweak){const t=new Tweak({container:root,onChange:render});t.addSelect(state,'layout',{label:'Candidate layout',options:[{label:'Four rows',value:'four'},{label:'Three rows',value:'three'}]});}
  })();
  </script>
